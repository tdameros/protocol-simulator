# Periodic emission is not a separate feature: it is a scenario that repeats.
# One concept to learn, one to maintain, and a heartbeat is a one-step file.

[[scenario]]
name = "Telemetry 10 Hz"
description = "What a board emits on its own, for as long as you let it"
on = "bus"

# `every_ms` is measured from the start of one pass to the start of the next,
# not from the end of one to the start of the next, so a slow pass does not push
# the following ones later and later.
#
# Leave `times` out to repeat until stopped, or set it to run a fixed number of
# passes and then finish.
repeat = { every_ms = 100 }

# `counters` makes a field carry a different number on every pass, which is what
# separates a simulation from a replay. `from` defaults to 0 and `step` to 1, so
# a plain sequence byte is just its wrap point.
#
# `wrap` is inclusive, so `wrap = 255` counts 0 to 255 and then starts again.
# The values have to fit what the field declares. `temperature` is an i16 in
# tenths of a degree, so 21.5 degrees is written 215, not 21.5: a float handed
# to an integer field fails the step rather than being rounded behind your back.
[[scenario.step]]
send = "Telemetry"
with = { temperature = 215, mode = 1 }
counters = { device_id = { wrap = 255 } }

[[scenario]]
name = "Heartbeat, ten times"
description = "A burst that stops on its own"
on = "bus"
repeat = { every_ms = 250, times = 10 }

[[scenario.step]]
raw = "7E 00 01 7E"
