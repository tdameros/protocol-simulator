# Types shared by every frame in the parent folder.
#
# Any `.toml` file in `types/` is loaded before the frames, and its `[[type]]`
# blocks become available to all of them. A frame can also declare a type inline
# with the same syntax; an inline definition wins over the shared one.

# A subtype: one scalar, narrowed. `u8` still says one byte goes on the wire;
# the range says which of those 256 values the protocol actually allows.
[[type]]
name = "Percent"
base = "u8"
range = { min = 0, max = 100 }

[[type]]
name = "LedConfig"
description = "One addressable LED"

[[type.field]]
name = "mode"
type = "enum"
repr = "u8"
variants = { OFF = 0, ON = 1, BLINK = 2, PULSE = 3 }

[[type.field]]
name = "brightness"
type = "Percent"
default = 80

[[type.field]]
name = "period_ms"
type = "u16"
description = "Blink or pulse period, ignored in OFF and ON"

[[type]]
name = "Rgb"

[[type.field]]
name = "red"
type = "u8"

[[type.field]]
name = "green"
type = "u8"

[[type.field]]
name = "blue"
type = "u8"
