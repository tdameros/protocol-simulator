# Types shared by every frame in the parent folder.
#
# Any `.toml` file in `types/` is loaded before the frames, and its `[[type]]`
# blocks become available to all of them. A frame can also declare a type inline
# with the same syntax; an inline definition wins over the shared one.

[[type]]
name = "LedConfig"
description = "One addressable LED"

[[type.field]]
name = "mode"
type = "enum"
repr = "u8"
variants = { OFF = 0, ON = 1, BLINK = 2, PULSE = 3 }

[[type.field]]
name = "brightness"
type = "u8"
default = 128

[[type.field]]
name = "period_ms"
type = "u16"
description = "Blink or pulse period, ignored in OFF and ON"

[[type]]
name = "Rgb"

[[type.field]]
name = "red"
type = "u8"

[[type.field]]
name = "green"
type = "u8"

[[type.field]]
name = "blue"
type = "u8"
