# Subtypes: a scalar restricted to the values the protocol actually allows.
#
# The Ada idea. `u8` says one byte goes on the wire; `range` says which of those
# 256 values mean anything. The wire format is unchanged — this frame is 9 bytes
# either way — but the editor will not let you dial a value your own
# specification forbids, and a received frame that breaks the rule is flagged.
#
# A subtype is a `[[type]]` with a `base` instead of fields:
#
#   [[type]]
#   name = "Percent"
#   base = "u8"
#   range = { min = 0, max = 100 }
#
# `Percent` lives in `types/led.toml`, shared by the whole folder.
#
# Ranges apply to scalars only, integer or float, and must fit the base:
# `range = { min = 0, max = 300 }` on a `u8` is refused at load time rather than
# truncated silently.

name = "Setpoints"
description = "A handful of constrained scalars, 9 bytes"
endian = "big"

# A subtype may narrow another one. This one only exists in this frame.
[[type]]
name = "LowPercent"
base = "Percent"
range = { min = 0, max = 25 }

[[field]]
name = "target"
type = "Percent"
default = 50
description = "Duty cycle, 0 to 100"

[[field]]
name = "idle"
type = "LowPercent"
description = "Never allowed above a quarter"

[[field]]
name = "trim"
type = "Percent"
# A field may narrow further still, as long as it stays inside its subtype.
range = { min = 40, max = 60 }

[[field]]
name = "gain"
type = "i16"
# No name needed for a one-off constraint.
range = { min = -500, max = 500 }

[[field]]
name = "ratio"
type = "f32"
range = { min = 0.0, max = 1.0 }
