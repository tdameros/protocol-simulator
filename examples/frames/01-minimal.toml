# The smallest frame worth sending: a start marker and a counter.
#
# `name` is what the simulator lists in the Frames tab. `endian` sets the byte
# order for every field below; individual fields may override it.

name = "Minimal"
description = "Start marker plus a rolling counter, 3 bytes"
endian = "big"

[[field]]
name = "marker"
type = "u8"
# `default` pre-fills the field, so you only type what actually varies.
default = 0x7E

[[field]]
name = "counter"
type = "u16"
