# Reusable types, so a structure that repeats is written once.
#
# A `[[type]]` block declares a group of fields. Naming that type as a field
# type instantiates it. Nothing about it survives into the encoded bytes: the
# frame below is the same 26 bytes you would get by writing all 21 fields out by
# hand, which is exactly the point.
#
# `LedConfig` and `Rgb` come from `types/led.toml`, shared by the whole folder.
# `Zone` is declared here because only this frame needs it.
#
# Instantiating a type expands its fields under the instance name:
#   repeat = 8                        ->  led[0].mode, led[1].mode, ...
#   instances = ["left", "right"]     ->  zone.left.led[0].mode, ...
#   neither                           ->  accent.red
#
# `repeat` works on ordinary fields too: `type = "u16"` with `repeat = 4` gives
# sample[0] through sample[3].

name = "LedController"
description = "Two zones of two LEDs plus an accent colour, 26 bytes"
endian = "big"

[[type]]
name = "Zone"
description = "A lighting zone, itself built from shared types"

[[type.field]]
name = "led"
type = "LedConfig"
repeat = 2

[[type.field]]
name = "accent"
type = "Rgb"

[[field]]
name = "header"
type = "u8"
default = 0x7E

[[field]]
name = "zone_count"
type = "u8"
default = 2

[[field]]
name = "zone"
type = "Zone"
# Named instances rather than indices: the editor shows `zone.left`, not `zone[0]`.
instances = ["left", "right"]

[[field]]
name = "crc"
type = "crc16"
algo = "crc16-ccitt"
# Naming `zone` covers every byte it expanded into. Change the instance list and
# the range follows, instead of quietly protecting the wrong bytes.
covers = { from = "header", to = "zone" }
