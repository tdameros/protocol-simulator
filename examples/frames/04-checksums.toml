# Checksums, and the range each one protects.
#
# Types: xor8, sum8, sum16, crc8, crc16, crc32
# CRC presets, given as `algo`:
#   crc8  crc16-ccitt  crc16-x25  crc16-xmodem  crc16-modbus  crc32
#
# `covers` names the first and last field protected, both included. Naming the
# fields rather than byte offsets means inserting a field later shifts the range
# with it instead of silently protecting the wrong bytes.
#
# Checksum fields are never typed in: they are computed when the frame is sent,
# and verified when one is received.

name = "DualChecksum"
description = "Header guarded on its own, then a CRC over everything before it, 13 bytes"
endian = "big"

[[field]]
name = "start"
type = "u8"
default = 0x02

[[field]]
name = "length"
type = "u8"
default = 8

[[field]]
name = "header_check"
type = "xor8"
# Only the two header bytes, so a receiver can trust the length before reading on.
covers = { from = "start", to = "length" }

[[field]]
name = "payload"
type = "bytes"
len = 8

[[field]]
name = "crc"
type = "crc16"
algo = "crc16-modbus"
# Everything that precedes it, header check byte included.
covers = { from = "start", to = "payload" }
