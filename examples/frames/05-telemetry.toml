# The frame the bench actually watches, sent at 10 Hz while the drive runs.
# Everything the previous files introduced, plus the shared header and the units
# from `types/`.

name = "Telemetry"
description = "Running values, 16 bytes"
endian = "big"

# Four bytes of header, written once in types/header.toml and named here.
[[field]]
name = "head"
type = "Header"

[[field]]
name = "rpm"
type = "Rpm"

[[field]]
name = "current"
type = "Milliamps"

[[field]]
name = "temperature"
type = "Celsius"

[[field]]
name = "load"
type = "Permille"
description = "Torque as a fraction of the rated maximum"

[[field]]
name = "state"
type = "enum"
repr = "u8"
variants = { IDLE = 0, STARTING = 1, RUNNING = 2, STOPPING = 3, FAULT = 4 }

[[field]]
name = "faults"
type = "bits"
repr = "u16"
bits = [
  { name = "overtemperature", width = 1 },
  { name = "overcurrent",     width = 1 },
  { name = "undervoltage",    width = 1 },
  { name = "stall",           width = 1 },
  { name = "spare",           width = 12 },
]

# Naming `head` covers all four of its bytes. The range follows the type, so
# adding a field to the header keeps the checksum over the whole of it.
[[field]]
name = "crc"
type = "crc16"
algo = "crc16-ccitt"
covers = { from = "head", to = "faults" }
