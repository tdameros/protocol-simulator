[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/sim-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# What gets downloaded, so size matters more than build time here.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Not panic = "abort": a panicking connection task is caught by the runtime and
# costs you that connection, where aborting would cost the whole session.
