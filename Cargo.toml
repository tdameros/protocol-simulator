[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/sim-gui"]

[workspace.package]
# The one place a version is written. Both crates inherit it, the release
# workflow reads it back with `cargo metadata`, and the tag it publishes is
# derived from it, so nothing can drift out of step with anything else.
version = "0.4.0"
edition = "2021"
# Either, at the user's option, which is the Rust ecosystem's convention and
# what egui and tokio themselves use. MIT for its brevity, Apache for the
# patent grant a legal department will ask about.
license = "MIT OR Apache-2.0"

# What gets downloaded, so size matters more than build time here.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Not panic = "abort": a panicking connection task is caught by the runtime and
# costs you that connection, where aborting would cost the whole session.
