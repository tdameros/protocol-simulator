[package]
name = "sim-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

# The crate is named for its place in the workspace; the file people download
# is named for what it is.
[[bin]]
name = "protocol-simulator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
sim-core = { path = "../sim-core" }
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui-phosphor = "0.13.0"
egui_dock = { version = "0.20", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tokio = { version = "1.53.1", features = ["sync"] }
tokio-serial = "5.5.0"
if-addrs = "0.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
# Drives the panels without a window, so what a click does is testable.
egui_kittest = "0.35"
