[package]
name = "sim-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
sim-core = { version = "0.1.0", path = "../sim-core" }
eframe = "0.35"
egui = "0.35"
egui-phosphor = "0.13.0"
egui_dock = "0.20"
tokio = { version = "1.53.1", features = ["sync"] }
tokio-serial = "5.5.0"
if-addrs = "0.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
