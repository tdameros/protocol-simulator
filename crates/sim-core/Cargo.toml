[package]
name = "sim-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-serial = "5.5.0"
toml = "1.1.4"
