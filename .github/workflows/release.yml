name: release

# One way in: the Run workflow button. Nothing here fires on a push, so no merge
# can ever publish anything. Leaving `publish` off builds the three artifacts and
# attaches them to the run; turning it on goes all the way to a GitHub release —
# a real one from main, a draft from any other branch.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Tag this commit and publish a GitHub release"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  BIN: protocol-simulator

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      prerelease: ${{ steps.read.outputs.prerelease }}
      draft: ${{ steps.read.outputs.draft }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so the guard below can see what has already been released.
          fetch-depth: 0

      - name: Read the workspace version
        id: read
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -r '.packages[] | select(.name == "sim-gui") | .version')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
          # 0.2.0-rc.1 must not become the download every visitor is offered.
          case "$version" in
            *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >>"$GITHUB_OUTPUT" ;;
          esac
          # Only main cuts a real release. Anywhere else is a rehearsal, and goes
          # out as a draft: the whole publish path runs and the artifacts land on
          # a real release page, but GitHub holds the tag back until someone
          # presses Publish, so the version stays free and deleting the draft
          # leaves no trace.
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "draft=false" >>"$GITHUB_OUTPUT"
          else
            echo "draft=true" >>"$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is not main — publishing v$version as a draft"
          fi
          echo "Building v$version"

      - name: Refuse a version that is already out
        if: inputs.publish
        env:
          TAG: ${{ steps.read.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG is already released — bump the workspace version first"
            exit 1
          fi

  build:
    name: ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: it fixes the glibc floor at 2.35, which is
          # what lets the binary run on Debian 12 and RHEL 9 as well.
          - os: ubuntu-22.04
            artifact: protocol-simulator-linux-x86_64.tar.gz
            rustflags: ""
          - os: windows-latest
            artifact: protocol-simulator-windows-x86_64.exe
            # Statically linked CRT, so the exe needs no Visual C++
            # redistributable. Set for the whole job rather than the build step:
            # changing RUSTFLAGS invalidates everything the tests just compiled.
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            artifact: protocol-simulator-macos-universal.zip
            rustflags: ""

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare the toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      # ci.yml only guards main, and a release can be cut from any commit. This
      # is the gate that makes the artifact itself trustworthy, so it runs
      # before anything is packaged and in the profile that ships.
      - name: Test
        run: cargo test --workspace --release --locked

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p sim-gui
          # tar rather than a bare file: it carries the executable bit, which a
          # browser download would otherwise strip.
          tar -C target/release -czf "${{ matrix.artifact }}" "$BIN"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p sim-gui
          Copy-Item "target/release/$env:BIN.exe" "${{ matrix.artifact }}"

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p sim-gui --target aarch64-apple-darwin
          cargo build --release --locked -p sim-gui --target x86_64-apple-darwin
          packaging/macos/bundle.sh "$VERSION"
          # ditto, not zip: it preserves the bundle layout and the exec bits.
          ditto -c -k --keepParent target/ProtocolSimulator.app "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: sed "s/__VERSION__/$TAG/g" packaging/release-notes.md >notes.md

      # No tag was pushed to get here, so this call creates it, on the exact
      # commit the artifacts above were built from — unless it is a draft, where
      # GitHub records the target and creates nothing until the draft is published.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          if [ "${{ needs.version.outputs.draft }}" = "true" ]; then
            flags+=(--draft)
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
